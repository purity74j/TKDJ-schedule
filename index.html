<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>トイカツ道場 講師時間割</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --surface2:#F0EAE0; --line:#DED5C6;
  --text:#211D17; --text2:#5C5548; --text3:#948C7D;
  --red:#C13B32; --red-dark:#A6332A; --amber:#A66A17; --heart:#C13B32;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif; -webkit-text-size-adjust:100%;}
.disp{font-family:'Bebas Neue',sans-serif; letter-spacing:0.04em;}
header{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); padding:14px 16px 10px;}
.brand{display:flex; align-items:baseline; gap:8px;}
.brand .disp{font-size:26px; color:var(--red); line-height:1;}
.brand .sub{font-size:12px; color:var(--text3);}
.search-row{margin-top:10px; position:relative;}
.search-row input{width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text); font-size:15px; padding:10px 12px 10px 36px; border-radius:10px; font-family:inherit;}
.search-row input::placeholder{color:var(--text3);}
.search-row svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:16px; height:16px; opacity:0.5;}
.mode-tabs{display:flex; gap:6px; margin-top:10px;}
.mode-tab{flex:1; text-align:center; padding:8px 4px; border-radius:8px; font-size:13px; font-weight:500; color:var(--text3); background:var(--surface); border:1px solid var(--line); cursor:pointer;}
.mode-tab.active{background:var(--red-dark); color:#fff; border-color:var(--red);}
.chip-row{display:flex; gap:6px; margin-top:10px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch;}
.chip-row.wrap{flex-wrap:wrap; overflow-x:visible;}
.chip{flex:0 0 auto; padding:6px 12px; border-radius:20px; border:1.5px solid var(--line); font-size:13px; font-weight:500; color:var(--text2); background:var(--surface); cursor:pointer; white-space:nowrap;}
.chip.round{width:32px; height:32px; border-radius:50%; padding:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;}
.chip.active{background:var(--red); border-color:var(--red); color:#fff;}
.filter-row{display:flex; gap:8px; margin-top:8px;}
.filter-row select{flex:1; background:var(--surface); border:1px solid var(--line); color:var(--text); font-size:13px; padding:8px 10px; border-radius:8px; font-family:inherit;}
.fav-toggle{display:flex; align-items:center; gap:6px; margin-top:8px; font-size:12px; color:var(--text2); cursor:pointer; width:fit-content;}
.check-row{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px;}
.check-toggle{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--text2); cursor:pointer;}
.check-toggle input{width:14px; height:14px; accent-color:var(--red); cursor:pointer;}
.field-label{font-size:11px; color:var(--text3); margin-top:10px; letter-spacing:0.04em;}
main{padding:10px 16px 40px;}
.section-label{font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:0.08em; margin:14px 0 6px; display:flex; justify-content:space-between;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:8px;}
.card-top{display:flex; justify-content:space-between; align-items:flex-start; cursor:pointer;}
.iname{font-size:15px; font-weight:500;}
.ifuri{font-size:11px; color:var(--text3); margin-top:2px;}
.count-badge{font-size:11px; color:var(--text3); background:var(--surface2); padding:3px 8px; border-radius:20px; white-space:nowrap;}
.heart-btn{background:none; border:none; padding:4px; cursor:pointer; color:var(--text3); display:flex; align-items:center;}
.heart-btn.liked{color:var(--heart);}
.heart-btn svg{width:18px; height:18px;}
.right-controls{display:flex; align-items:center; gap:4px;}
.week{margin-top:10px; border-top:1px solid var(--line); padding-top:10px; display:none;}
.week.open{display:block;}
.slot-row{display:flex; align-items:baseline; gap:8px; padding:5px 0; font-size:13px; border-bottom:1px solid rgba(0,0,0,0.06);}
.slot-row:last-child{border-bottom:none;}
.slot-day{flex:0 0 20px; color:var(--red); font-weight:700;}
.slot-hour{flex:0 0 42px; color:var(--text2); font-variant-numeric:tabular-nums;}
.slot-store{flex:0 0 auto; color:var(--text3); font-size:12px;}
.slot-cat{flex:1; text-align:right; color:var(--text);}
.slot-content{display:block; font-size:11px; color:var(--text3); text-align:right;}
.result-row{padding:9px 0; border-bottom:1px solid rgba(0,0,0,0.07);}
.result-row:last-child{border-bottom:none;}
.r-line1{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
.r-instr{font-size:14px; font-weight:500; color:var(--text);}
.r-store{font-size:12px; color:var(--amber); flex:0 0 auto;}
.r-line2{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-top:3px;}
.r-daytime{flex:0 0 auto; display:flex; align-items:baseline; gap:5px;}
.r-day{font-size:13px; font-weight:700; color:var(--red);}
.r-hour{font-size:11px; color:var(--text3); font-variant-numeric:tabular-nums;}
.r-mid{flex:1; min-width:0; text-align:right;}
.r-cat{font-size:14px;}
.r-content{font-size:12px; color:var(--text3);}
.empty{text-align:center; color:var(--text3); padding:40px 20px; font-size:13px;}
.chev{transition:transform 0.15s; color:var(--text3);}
.chev.open{transform:rotate(180deg);}
</style>
</head>

  <div class="mode-tabs">

  <div id="instrControls">
    <div class="search-row">

      <input id="searchInput" type="text" placeholder="講師名で検索">
    </div>
    <div class="chip-row" id="gojuonRow"></div>
    <div class="fav-toggle" id="favToggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21l7.78-7.55 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>

  <div id="classControls" style="display:none;">
    <div class="field-label">カテゴリ</div>
    <div class="filter-row">
      <select id="catSelect"><option value="">すべて</option></select>
    </div>
    <div class="field-label">曜日（複数選択可）</div>
    <div class="chip-row" id="classDayRow"></div>
    <div class="field-label">時間（複数選択可）</div>
    <div class="chip-row wrap" id="hourRow"></div>
    <div class="check-row">
      <label class="check-toggle"><input type="checkbox" id="excludeKidsCheck"><span>キッズ除く</span></label>
      <label class="check-toggle"><input type="checkbox" id="excludeBeginnerCheck"><span>超初心者除く</span></label>
      <label class="check-toggle"><input type="checkbox" id="massSparringOnlyCheck"><span>マススパーリングのみ</span></label>
    </div>
    <div class="fav-toggle" id="classFavToggle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21l7.78-7.55 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <span>いいねした講師だけ表示</span>
    </div>
  </div>
</header>

<main id="main"></main>

<script>
const DATA = JSON.parse(document.getElementById('app-data').textContent);
const DAYS = ['月','火','水','木','金','土','日'];
const HOURS = ['7:00','8:00','9:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00'];

const GOJUON = [
  {label:'あ', chars:'あいうえお'},
  {label:'か', chars:'かきくけこがぎぐげご'},
  {label:'さ', chars:'さしすせそざじずぜぞ'},
  {label:'た', chars:'たちつてとだぢづでど'},
  {label:'な', chars:'なにぬねの'},
  {label:'は', chars:'はひふへほばびぶべぼぱぴぷぺぽ'},
  {label:'ま', chars:'まみむめも'},
  {label:'や', chars:'やゆよ'},
  {label:'ら', chars:'らりるれろ'},
  {label:'わ', chars:'わをん'},
  {label:'#', chars:null}
];
function gojuonGroup(furi){
  if(!furi) return '#';
  const c = furi[0];
  for(const g of GOJUON){
    if(g.chars && g.chars.includes(c)) return g.label;
  }
  return '#';
}

let favorites = {};
try{
  favorites = JSON.parse(localStorage.getItem('toicatsu_favs') || '{}');
}catch(e){ favorites = {}; }
function saveFavorites(){
  try{ localStorage.setItem('toicatsu_favs', JSON.stringify(favorites)); }catch(e){}
}

let mode = 'instr';
let query = '';
let gojuonFilter = '';
let favOnly = false;

let classCat = '';
let classDays = new Set();
let classHours = new Set();

const main = document.getElementById('main');
const searchInput = document.getElementById('searchInput');
const gojuonRow = document.getElementById('gojuonRow');
const favToggle = document.getElementById('favToggle');
const instrControls = document.getElementById('instrControls');
const classControls = document.getElementById('classControls');
let classFavOnly = false;
let excludeKids = false;
let excludeBeginner = false;
let massSparringOnly = false;

const catSelect = document.getElementById('catSelect');
const classDayRow = document.getElementById('classDayRow');
const hourRow = document.getElementById('hourRow');

GOJUON.forEach(g=>{
  const chip = document.createElement('div');
  chip.className = 'chip round';
  chip.textContent = g.label;
  chip.onclick = ()=>{
    gojuonFilter = (gojuonFilter === g.label) ? '' : g.label;
    renderGojuonChips();
    render();
  };
  chip.dataset.label = g.label;
  gojuonRow.appendChild(chip);
});
function renderGojuonChips(){
  Array.from(gojuonRow.children).forEach(c=>{
    c.classList.toggle('active', c.dataset.label === gojuonFilter);
  });
}

favToggle.onclick = ()=>{
  favOnly = !favOnly;
  favToggle.style.color = favOnly ? 'var(--heart)' : '';
  render();
};

DATA.cats.forEach(c=>{
  const o = document.createElement('option');
  o.value = c; o.textContent = c;
  catSelect.appendChild(o);
});
catSelect.addEventListener('change', e=>{ classCat = e.target.value; render(); });

const classFavToggle = document.getElementById('classFavToggle');
classFavToggle.onclick = ()=>{
  classFavOnly = !classFavOnly;
  classFavToggle.style.color = classFavOnly ? 'var(--heart)' : '';
  render();
};

document.getElementById('excludeKidsCheck').addEventListener('change', e=>{
  excludeKids = e.target.checked; render();
});
document.getElementById('excludeBeginnerCheck').addEventListener('change', e=>{
  excludeBeginner = e.target.checked; render();
});
document.getElementById('massSparringOnlyCheck').addEventListener('change', e=>{
  massSparringOnly = e.target.checked; render();
});

DAYS.forEach(d=>{
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.textContent = d;
  chip.onclick = ()=>{
    if(classDays.has(d)) classDays.delete(d); else classDays.add(d);
    chip.classList.toggle('active');
    render();
  };
  classDayRow.appendChild(chip);
});

HOURS.forEach(h=>{
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.textContent = h.replace(':00','');
  chip.onclick = ()=>{
    if(classHours.has(h)) classHours.delete(h); else classHours.add(h);
    chip.classList.toggle('active');
    render();
  };
  hourRow.appendChild(chip);
});

document.querySelectorAll('.mode-tab').forEach(tab=>{
  tab.onclick = ()=>{
    document.querySelectorAll('.mode-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    mode = tab.dataset.mode;
    instrControls.style.display = mode==='instr' ? 'block' : 'none';
    classControls.style.display = mode==='class' ? 'block' : 'none';
    render();
  };
});

searchInput.addEventListener('input', e=>{ query = e.target.value.trim(); render(); });

function renderInstructorMode(){
  let list = DATA.instructors;
  if(gojuonFilter) list = list.filter(i=> gojuonGroup(i.f) === gojuonFilter);
  if(query) list = list.filter(i=> i.n.includes(query) || i.f.includes(query));
  if(favOnly) list = list.filter(i=> favorites[i.n]);
  main.innerHTML = '';
  const label = document.createElement('div');
  label.className = 'section-label';
  label.innerHTML = '<span>講師一覧</span><span>'+list.length+'人</span>';
  main.appendChild(label);
  if(list.length===0){
    main.innerHTML += '<div class="empty">該当する講師が見つかりません</div>';
    return;
  }
  list.forEach(instr=>{
    const card = document.createElement('div');
    card.className = 'card';
    const liked = !!favorites[instr.n];
    card.innerHTML =
      '<div class="card-top">'+
        '<div><div class="iname">'+instr.n+'</div><div class="ifuri">'+instr.f+'</div></div>'+
        '<div class="right-controls">'+
          '<span class="count-badge">週'+instr.slots.length+'コマ</span>'+
          '<button class="heart-btn'+(liked?' liked':'')+'" aria-label="いいね">'+
            '<svg viewBox="0 0 24 24" fill="'+(liked?'currentColor':'none')+'" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21l7.78-7.55 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'+
          '</button>'+
          '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>'+
        '</div>'+
      '</div>'+
      '<div class="week"></div>';
    const top = card.querySelector('.card-top');
    const week = card.querySelector('.week');
    const chev = card.querySelector('.chev');
    const heartBtn = card.querySelector('.heart-btn');
    heartBtn.onclick = (ev)=>{
      ev.stopPropagation();
      favorites[instr.n] = !favorites[instr.n];
      saveFavorites();
      heartBtn.classList.toggle('liked');
      heartBtn.querySelector('svg').setAttribute('fill', favorites[instr.n] ? 'currentColor' : 'none');
      if(favOnly && !favorites[instr.n]) render();
    };
    top.onclick = (ev)=>{
      if(ev.target.closest('.heart-btn')) return;
      week.classList.toggle('open');
      chev.classList.toggle('open');
      if(week.classList.contains('open') && week.children.length===0){
        instr.slots.forEach(sl=>{
          const row = document.createElement('div');
          row.className = 'slot-row';
          row.innerHTML =
            '<span class="slot-day">'+sl.d+'</span>'+
            '<span class="slot-hour">'+sl.h+'</span>'+
            '<span class="slot-store">'+sl.s+'</span>'+
            '<span class="slot-cat">'+sl.c+(sl.t?'<span class="slot-content">'+sl.t+'</span>':'')+'</span>';
          week.appendChild(row);
        });
      }
    };
    main.appendChild(card);
  });
}

let ALL_SLOTS = null;
function buildAllSlots(){
  if(ALL_SLOTS) return ALL_SLOTS;
  ALL_SLOTS = [];
  DATA.instructors.forEach(instr=>{
    instr.slots.forEach(sl=>{
      ALL_SLOTS.push({s:sl.s, d:sl.d, h:sl.h, c:sl.c, t:sl.t, instr:instr.n, furi:instr.f});
    });
  });
  return ALL_SLOTS;
}

function renderClassMode(){
  main.innerHTML = '';
  let slots = buildAllSlots();
  if(classCat) slots = slots.filter(sl=> sl.c === classCat);
  if(classDays.size>0) slots = slots.filter(sl=> classDays.has(sl.d));
  if(classHours.size>0) slots = slots.filter(sl=> classHours.has(sl.h));
  if(classFavOnly) slots = slots.filter(sl=> favorites[sl.instr]);
  if(excludeKids) slots = slots.filter(sl=> !sl.t.includes('キッズ'));
  if(excludeBeginner) slots = slots.filter(sl=> !sl.t.includes('超初心者'));
  if(massSparringOnly) slots = slots.filter(sl=> sl.t.includes('マススパーリング'));

  const hasFilter = classCat || classDays.size>0 || classHours.size>0 || classFavOnly || excludeKids || excludeBeginner || massSparringOnly;
  const label = document.createElement('div');
  label.className = 'section-label';
  label.innerHTML = '<span>検索結果</span><span>'+slots.length+'コマ</span>';
  main.appendChild(label);

  if(!hasFilter){
    main.innerHTML += '<div class="empty">カテゴリ・曜日・時間を選んで絞り込んでください</div>';
    return;
  }
  if(slots.length===0){
    main.innerHTML += '<div class="empty">条件に合うクラスが見つかりません</div>';
    return;
  }
  slots.sort((a,b)=>{
    if(a.furi !== b.furi) return a.furi < b.furi ? -1 : 1;
    return a.instr < b.instr ? -1 : (a.instr > b.instr ? 1 : 0);
  });
  const card = document.createElement('div');
  card.className = 'card';
  slots.forEach(sl=>{
    const row = document.createElement('div');
    row.className = 'result-row';
    const heart = favorites[sl.instr] ? ' <span style="color:var(--heart)">\u2665</span>' : '';
    row.innerHTML =
      '<div class="r-line1"><span class="r-instr">'+sl.instr+heart+'</span><span class="r-store">'+sl.s+'</span></div>'+
      '<div class="r-line2"><span class="r-daytime"><span class="r-day">'+sl.d+'</span><span class="r-hour">'+sl.h+'</span></span>'+
      '<span class="r-mid"><span class="r-cat">'+sl.c+'</span>'+(sl.t?' <span class="r-content">'+sl.t+'</span>':'')+'</span></div>';
    card.appendChild(row);
  });
  main.appendChild(card);
}

function render(){
  if(mode==='instr') renderInstructorMode();
  else renderClassMode();
}

render();
</script>
</body>
</html>
